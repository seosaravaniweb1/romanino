<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
<!--
  قاب تذهیب فوتر «انتشارات سرو».
  ─────────────────────────────────────────────────────────────────────────
  این فایل به‌صورت «۹ تکه» (border-image / 9-slice) استفاده می‌شود:
  ۱۴۰ پیکسل از هر طرف = گوشه‌ها (نگاره‌های اسلیمی)، وسط = زمینهٔ کاغذی که
  کشیده می‌شود. به همین دلیل قاب در هر عرض و ارتفاعی — از موبایل تا مانیتور
  عریض — بدون کشیده‌شدنِ نگاره‌ها درست نمایش داده می‌شود.
  رنگ‌ها هماهنگ با پالت قالب: کاغذ کرم + خطوط طلایی.
-->
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdf9f0"></stop>
    <stop offset=".55" stop-color="#f7efdd"></stop>
    <stop offset="1" stop-color="#f2e7d1"></stop>
  </linearGradient>
  <linearGradient id="goldline" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9b769"></stop>
    <stop offset=".5" stop-color="#b08a3c"></stop>
    <stop offset="1" stop-color="#d9b769"></stop>
  </linearGradient>

  <!-- نگارهٔ گوشه: یک بار تعریف، چهار بار آینه‌ای استفاده می‌شود -->
  <g id="corner">
    <!-- ساقهٔ اصلی اسلیمی (قوسِ بلندِ گوشه) -->
    <path d="M6 112 C34 104 48 84 52 60 C56 36 72 22 98 18 C118 15 128 20 138 8"
          fill="none" stroke="#c9a24b" stroke-width="1.7" stroke-linecap="round" opacity=".9"/>
    <!-- ساقهٔ دوم، کمی تودارتر -->
    <path d="M6 86 C28 80 40 66 44 48 C48 32 60 22 78 18 C92 15 100 18 108 10"
          fill="none" stroke="#c9a24b" stroke-width="1.2" stroke-linecap="round" opacity=".62"/>
    <!-- ساقهٔ سوم، کوتاه -->
    <path d="M6 62 C22 58 30 48 33 36 C36 26 43 19 54 16"
          fill="none" stroke="#c9a24b" stroke-width=".9" stroke-linecap="round" opacity=".45"/>

    <!-- برگ‌های اسلیمی روی ساقهٔ اصلی -->
    <path d="M52 60 C43 51 43 38 54 33 C62 43 61 53 52 60 Z" fill="#c9a24b" opacity=".5"/>
    <path d="M98 18 C90 11 90 1 100 -2 C106 6 105 14 98 18 Z" fill="#c9a24b" opacity=".45"/>
    <path d="M30 92 C22 85 22 74 32 70 C38 78 38 87 30 92 Z" fill="#c9a24b" opacity=".42"/>
    <path d="M72 32 C66 24 68 15 78 13 C82 22 80 29 72 32 Z" fill="#c9a24b" opacity=".4"/>
    <path d="M16 74 C10 68 11 60 19 57 C23 64 22 71 16 74 Z" fill="#c9a24b" opacity=".34"/>
    <path d="M118 12 C113 6 114 -1 122 -3 C125 3 124 9 118 12 Z" fill="#c9a24b" opacity=".3"/>

    <!-- برگ‌های قرینه (سمت مخالف ساقه) -->
    <path d="M44 48 C50 40 60 40 63 48 C55 54 48 54 44 48 Z" fill="#c9a24b" opacity=".3"/>
    <path d="M78 18 C84 11 93 12 95 19 C88 24 82 23 78 18 Z" fill="#c9a24b" opacity=".28"/>

    <!-- غنچه‌ها و نقطه‌های تذهیب -->
    <circle cx="130" cy="10" r="3.2" fill="#b08a3c" opacity=".7"/>
    <circle cx="10" cy="130" r="3.2" fill="#b08a3c" opacity=".7"/>
    <circle cx="64" cy="46" r="2.4" fill="#b08a3c" opacity=".55"/>
    <circle cx="36" cy="78" r="1.9" fill="#b08a3c" opacity=".45"/>
    <circle cx="88" cy="26" r="1.9" fill="#b08a3c" opacity=".45"/>
    <circle cx="22" cy="46" r="1.5" fill="#b08a3c" opacity=".35"/>
    <circle cx="112" cy="30" r="1.5" fill="#b08a3c" opacity=".35"/>

    <!-- شاخه‌های ریزِ پرکننده -->
    <path d="M120 8 C110 18 94 24 84 22" fill="none" stroke="#c9a24b" stroke-width="1" stroke-linecap="round" opacity=".5"/>
    <path d="M8 120 C18 110 24 94 22 84" fill="none" stroke="#c9a24b" stroke-width="1" stroke-linecap="round" opacity=".5"/>
    <path d="M64 46 C74 44 82 36 84 26" fill="none" stroke="#c9a24b" stroke-width=".8" stroke-linecap="round" opacity=".4"/>
    <path d="M36 78 C46 76 52 68 54 58" fill="none" stroke="#c9a24b" stroke-width=".8" stroke-linecap="round" opacity=".4"/>
  </g>

  <!-- گل شاه‌عباسیِ میانهٔ ضلع‌ها (در HTML جداگانه استفاده می‌شود) -->
  <g id="rosette">
    <path d="M0 -13 C5 -6 5 6 0 13 C-5 6 -5 -6 0 -13 Z" fill="#c9a24b" opacity=".55"/>
    <path d="M-13 0 C-6 -5 6 -5 13 0 C6 5 -6 5 -13 0 Z" fill="#c9a24b" opacity=".55"/>
    <circle cx="0" cy="0" r="3" fill="#b08a3c" opacity=".8"/>
  </g>
</defs>

<!-- زمینهٔ کاغذی -->
<rect x="6" y="6" width="588" height="388" rx="18" fill="url(#paper)"></rect>

<!-- قاب بیرونی (خط ضخیم) و قاب داخلی (خط مویی) -->
<rect x="6" y="6" width="588" height="388" rx="18" fill="none" stroke="url(#goldline)" stroke-width="3"></rect>
<rect x="15" y="15" width="570" height="370" rx="12" fill="none" stroke="#c9a24b" stroke-width="1" opacity=".55"></rect>
<rect x="21" y="21" width="558" height="358" rx="9" fill="none" stroke="#c9a24b" stroke-width=".7" opacity=".3"></rect>

<!-- چهار گوشه (سه‌تای دیگر با آینه‌کردن همان نگاره ساخته می‌شوند) -->
<g transform="translate(24,24)"><use href="#corner"/></g>
<g transform="translate(576,24) scale(-1,1)"><use href="#corner"/></g>
<g transform="translate(24,376) scale(1,-1)"><use href="#corner"/></g>
<g transform="translate(576,376) scale(-1,-1)"><use href="#corner"/></g>
</svg>
